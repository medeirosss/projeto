<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alvos</title><link rel="stylesheet" href="/assets/style.css"></head><body class="centric-page" data-theme="dark">
<div class="topbar modern-topbar"><div class="top-left"><div class="brand"><img id="brandLogo" src="/assets/logo.png" alt="Logo"><span>Centric</span></div><nav class="menu" id="mainMenu"></nav></div><div class="top-right"><span>Descoberta e identificação de ativos</span></div></div>
<div class="report-layout">
  <aside class="report-sidebar"><div class="sidebar-group"><div class="report-group-title">Alvos</div><nav class="report-nav"><a class="active" href="#">Máquinas descobertas</a></nav></div><div class="sidebar-user"></div></aside>
  <main class="report-content settings-content alerts-content">
    <section class="report-section">
      <div class="toolbar"><div><div class="title">Alvos</div><p class="section-subtitle">Máquinas identificadas pelo Magi por nome, endereço IP e endereço MAC.</p></div><button class="btn secondary btn-sm" id="targetsRefreshBtn" type="button">Atualizar</button></div>
      <div class="mini-stats alert-stats"><div class="mini-stat"><small>Total de alvos</small><strong id="targetsTotal">0</strong></div><div class="mini-stat"><small>Última descoberta</small><strong id="lastDiscoveryStatus">—</strong></div></div>
      <div class="card alerts-card"><div class="card-header">Nova descoberta</div><div class="card-body">
        <div class="form-grid"><label>IPv4 ou rede CIDR<input id="discoveryTargetSpec" placeholder="Ex.: 192.168.0.10 ou 192.168.0.0/24"></label></div>
        <div class="detail-actions"><button class="btn primary btn-sm" id="discoveryStartBtn" type="button">Iniciar descoberta</button></div>
        <pre id="discoveryResult" class="result-box">Aguardando descoberta.</pre>
      </div></div>
      <div class="card alerts-card" style="margin-top:16px"><div class="card-header">Máquinas</div><div class="card-body">
        <input id="targetsSearch" placeholder="Buscar por nome, IP ou MAC">
        <div class="table-wrap"><table><thead><tr><th>Nome</th><th>IP</th><th>MAC</th><th>Última detecção</th></tr></thead><tbody id="targetsTable"></tbody></table></div>
      </div></div>
    </section>
  </main>
</div>
<script src="/assets/common.js"></script><script src="/assets/targets.js"></script>
</body></html>
