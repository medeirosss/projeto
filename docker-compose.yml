services:
  db:
    image: postgres:15
    container_name: magi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magi}
      POSTGRES_USER: ${POSTGRES_USER:-magi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - magi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magi} -d ${POSTGRES_DB:-magi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/medeirosss/magi-backend:v000.8.2
    container_name: magi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8443"
    cap_add:
      - NET_RAW
    volumes:
      - magi_license:/app/license
      - magi_logs:/app/logs
      - magi_scripts:/app/scripts
      - ./atomic-red-team:/opt/atomic-red-team:ro

volumes:
  magi_pgdata:
  magi_license:
  magi_logs:
  magi_scripts:
